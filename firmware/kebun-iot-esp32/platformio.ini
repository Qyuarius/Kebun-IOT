[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

board_build.filesystem = littlefs

[env:upload_data]
extends = env:esp32dev
board_build.embed_txflags = -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
extra_scripts = pre:upload_data.py
